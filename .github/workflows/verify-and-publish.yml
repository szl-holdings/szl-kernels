name: Verify and publish SZL kernels

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: szl-kernels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel-contract:
    name: Kernel contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --disable-pip-version-check "pytest>=8,<9"
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.7.1"
      - name: Run governed-kernel tests
        run: >-
          python -m pytest -q
          tests/test_suite.py
          tests/test_replay_portability.py

  artifact-replay:
    name: MiniEmbed artifact replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned public replay matrix
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-replay.txt
      - name: Verify shipped hashes and bounded replay
        run: python scripts/eval.py

  source-binding:
    name: Source binding contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install publication client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface-hub==1.23.0"
      - name: Run offline publication tests
        env:
          PYTHONPATH: tools
        run: python -m unittest -v tools/test_publish_source_binding.py
      - name: Verify local and public artifact contract
        run: >-
          python tools/publish_source_binding.py
          --source-revision "${SOURCE_REVISION}"
          --report reports/source-binding-dry-run.json
      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-binding-dry-run-${{ github.run_id }}
          path: reports/source-binding-dry-run.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish exact source and verify readback
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [kernel-contract, artifact-replay, source-binding]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install publication client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface-hub==1.23.0"
      - name: Publish declared artifact set and verify exact readback
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
        run: >-
          python tools/publish_source_binding.py
          --source-revision "${GITHUB_SHA}"
          --publish
          --report reports/source-binding-published.json
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-binding-published-${{ github.run_id }}
          path: reports/source-binding-published.json
          if-no-files-found: error
          retention-days: 90
